<svg xmlns="http://www.w3.org/2000/svg" id="animated" viewBox="0 0 725 559" role="img" aria-labelledby="wraith-title wraith-description">
  <title id="wraith-title">TimeWraith holding a violet lantern</title>
  <desc id="wraith-description">A shadowed figure with violet eyes drifts in a tattered hooded cloak, carrying a lit iron lantern.</desc>
  <style>
    /* Opt in with #animated. The plain asset stays still for the intro and reduced motion. */
    svg:target #lantern-flame {
      transform-origin: 461px 320px;
      animation: flame-flicker 2.7s linear infinite;
    }
    svg:target #lantern-glass { animation: glass-flicker 2.7s linear infinite; }
    svg:target #cloak-lantern-light { animation: cloth-flicker 2.7s linear infinite; }
    @keyframes flame-flicker {
      0%, 100% { opacity: .9; transform: scale(.95, 1); }
      13% { opacity: .66; transform: scale(1.08, .88); }
      21% { opacity: 1; transform: scale(.89, 1.12); }
      35% { opacity: .8; transform: scale(1.03, .96); }
      47% { opacity: .96; transform: scale(.94, 1.08); }
      56% { opacity: .62; transform: scale(1.05, .86); }
      62% { opacity: .93; transform: scale(.9, 1.1); }
      79% { opacity: .76; transform: scale(1.04, .94); }
      91% { opacity: 1; transform: scale(.93, 1.06); }
    }
    @keyframes glass-flicker {
      0%, 100% { opacity: .96; }
      13% { opacity: .79; }
      21% { opacity: 1; }
      35% { opacity: .89; }
      47% { opacity: .98; }
      56% { opacity: .76; }
      62% { opacity: .97; }
      79% { opacity: .86; }
      91% { opacity: 1; }
    }
    @keyframes cloth-flicker {
      0%, 100% { opacity: .91; }
      13% { opacity: .64; }
      21% { opacity: 1; }
      35% { opacity: .8; }
      47% { opacity: .96; }
      56% { opacity: .58; }
      62% { opacity: .95; }
      79% { opacity: .74; }
      91% { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      svg:target #lantern-flame, svg:target #lantern-glass, svg:target #cloak-lantern-light { animation: none; }
    }
  </style>
